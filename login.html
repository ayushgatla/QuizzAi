<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="QuizzAi/style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="module" src="firebase.js"></script>
    <script type="module" src="auth.js"></script>
    <title>QuizzAi - Learn by Practice</title>
  </head>

  <body class="min-h-screen bg-teal-300 relative overflow-hidden">
    <!-- STAR BACKGROUND (should be behind everything) -->
    <div class="star-container absolute inset-0 z-0">
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-4"></div>
      <div class="star star-5"></div>
      <div class="star star-3"></div>
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-3"></div>
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-3"></div>
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
      <div class="star star-3"></div>
      <div class="star star-1"></div>
      <div class="star star-2"></div>
      <div class="star star-3"></div>
    </div>

    <!-- MAIN CONTENT -->
    <div
      class="relative z-10 flex flex-col items-center justify-center min-h-screen"
    >
      <h2 id="text" class="text-shadows mb-10">WELCOME TO QUIZZAI !</h2>

      <div id="main" class="flex flex-col items-center justify-center mt-10">
        <div
          id="continue"
          class="rounded-2xl flex justify-center items-center border-4 border-white p-3 cursor-pointer"
        >
          <button onclick="startauth()">Continue</button>
        </div>
      </div>
    </div>

    <script>
      const text = document.getElementById("text");
      const content = text.textContent.trim();
      text.textContent = "";
      let index = 0;

      function showNextChar() {
        if (index < content.length) {
          text.textContent += content[index];
          index++;
          setTimeout(showNextChar, 80);
        }
      }
      showNextChar();

      function startauth() {
        const cont = document.getElementById("continue");
        cont.classList.add("hidden");

        const main = document.getElementById("main");

        const loginpage = document.createElement("div");
        loginpage.classList.add(
          "w-64",
          "h-72",
          "bg-black",
          "rounded-xl",
          "flex",
          "flex-col",
          "gap-4",
          "items-center",
          "justify-center",
          "text-white",
          "p-4"
        );

        const logo = document.createElement("img");
        logo.src = "QuizzAi/icons/download-removebg-preview.png";
        logo.classList.add("w-16", "h-16", "mb-3");
        loginpage.append(logo);

        const title = document.createElement("div");
        title.textContent = "Continue with Google";
        loginpage.append(title);

        const google = document.createElement("button");
        google.id = "google";

        const image = document.createElement("img");
        image.src = "QuizzAi/icons/googleicon.png";
        image.classList.add("h-6", "w-6");
        google.append(image);

        google.classList.add(
          "rounded-xl",
          "border-2",
          "border-white",
          "px-4",
          "py-2",
          "cursor-pointer",
          "bg-white",
          "text-black",
          "hover:bg-gray-200"
        );

        loginpage.append(google);
        main.append(loginpage);

        import("./auth.js").then((module) => {
          module.setupGoogleButton();
        });
      }
    </script>
  </body>
</html>
